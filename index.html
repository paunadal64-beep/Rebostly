.rtmp{height:6px;border-radius:99px;background:#e2e8f0;overflow:hidden;margin-top:8px}.rtmp i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#F59E0B,#FDE047)}
.rtmt{display:flex;align-items:center;gap:4px;margin-top:4px;font-size:11.5px;font-weight:700;color:#92400E}
.rtb{display:inline-flex;align-items:center;gap:5px;margin-top:9px;padding:8px 16px;border-radius:12px;font-weight:800;font-size:13px;background:linear-gradient(135deg,#F59E0B,#FACC15);color:#0E172A;box-shadow:0 4px 12px #f59e0b40}
.rtb.ok{background:#dcfce7;color:#166534;box-shadow:none}
.rtpv{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.rtlk{filter:grayscale(1);opacity:.5}
.rtsw2{display:flex;gap:5px}.rtsw2 i{width:22px;height:22px;border-radius:7px;display:block}
.rtgn{background:linear-gradient(100deg,#B45309,#F59E0B 30%,#FDE68A 50%,#F59E0B 70%,#B45309);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;-webkit-text-fill-color:transparent;animation:rtsh 3s linear infinite;font-weight:800}
@keyframes rtsh{to{background-position:-200% 0}}
.rtvip{display:inline-block;vertical-align:middle;font-size:10px;font-weight:800;letter-spacing:.6px;padding:2px 7px;border-radius:99px;background:linear-gradient(135deg,#F59E0B,#FDE047);color:#451a03}
.rtic{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#B45309,#FACC15);display:grid;place-items:center;color:#451a03;font-weight:800;font-size:18px;box-shadow:0 3px 8px #b4530955}
.rtwg{padding:7px 11px;border-radius:12px;background:linear-gradient(135deg,#1c1917,#44340a);color:#FDE68A;font-size:11.5px;font-weight:700;box-shadow:inset 0 0 0 1px #F59E0B88}
.rtdemo{display:block;margin:14px auto 4px;padding:8px 14px;border-radius:99px;font-size:11.5px;color:#64748b;background:#f1f5f9}
.ph.neon{filter:invert(1) hue-rotate(180deg) saturate(1.7) contrast(1.05);border-color:#e9edf5}

.rti.gd{background:#fef3c7;color:#B45309}.rti.lk{background:#f1f5f9;color:#94a3b8}

.rtgi.rtlk{box-shadow:none}
.rtpt{color:#92400E;font-weight:700;font-size:12px;white-space:nowrap}
.rtr .rtt{margin-bottom:1px;font-size:13.5px}
.rtcp2{display:inline-block;margin-top:3px;padding:2px 9px;border-radius:99px;background:#eff6ff;color:#1d4ed8;font-size:10.5px;font-weight:800}
.rtact{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:99px;background:#dcfce7;color:#166534;font-size:11px;font-weight:800}
.rtlkc{display:grid;justify-items:center;gap:1px;width:56px;padding:5px 0;border-radius:14px;background:#f1f5f9;color:#64748b;font-size:10px;font-weight:800;white-space:nowrap;box-shadow:inset 0 1px 3px #0001}.rtlkc svg{margin-bottom:0}
.rtsx{position:relative;width:56px;height:28px;border-radius:99px;background:#cbd5e1;flex:none;transition:background .25s;box-shadow:inset 0 1px 3px #0002}

.rtst{position:absolute;top:0;bottom:0;right:9px;display:flex;align-items:center;font-size:9.5px;font-weight:800;letter-spacing:.5px;color:#64748b}
.rtsx.on{background:linear-gradient(135deg,#22C55E,#10B981)}.rtsx.on.au{background:linear-gradient(135deg,#F59E0B,#FACC15)}

.rtwg3 span{font-size:12px;font-weight:700}

.rtdy.sv{background:linear-gradient(135deg,#38BDF8,#6366F1);box-shadow:0 0 10px #6366f180}

plGen=()=>{const ids=RC.map((_,i)=>i),ex=ids.filter(i=>RC[i][7]).slice(0,2),old=DY.flatMap((_,i)=>[S.pl[i],S.pd[i]]).join(),sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};let m;
for(let t=0;t<300;t++){m=Array(14).fill(-1);const c={};let ok=1;ex.forEach((r,k)=>{m[k*3]=r;c[r]=1});const q=sh([...ids,...ids]);

rtN=m=>{const k=m.k||0,nm=(m.n||'').toLowerCase(),pr=P.find(p=>nm.includes(p.n.toLowerCase())),f=pr?Math.min(pr.w,100)/pr.w:0;return {sa:pr?pr.sa*f:k/100*(RT_SL.test(nm)?.9:.1),su:pr?pr.s*f:k/100*(RT_SW.test(nm)?14:1.2),p:m.p!=null?m.p:pr?pr.p*f:k/100*(RT_PR.test(nm)?7.5:3.5),up:RT_UP.test(nm)}},

gMet=t=>{const s=t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''),T=[[/escal|boulder|rocodromo/,8],[/kart/,4],[/surf|bodyboard/,5],[/esqu|snowboard/,6.5],[/remo|kayak|piragu/,6],[/boxeo|kickbox|muay|mma|lucha/,9],[/golf/,4.8],[/equit|caballo|hipica/,5.5],[/zumba|aerobic|aerobi/,6.5],[/spinning|ciclo indoor/,8.5],[/step/,8],[/ping|tenis de mesa/,4],[/badminton|squash/,6],[/rugby/,8.3],[/hockey/,8],[/beisbol|softbol|cricket/,5],[/atletismo|sprint|maraton|carrera/,9],[/waterpolo/,10],[/aquagym|aqua/,5.5],[/tiro con arco|arco/,3.5],[/skate|monopatin/,5],[/trekking|montan|alpinismo|senderismo/,6.5],[/petanca|billar|bolos|dardos|pesca/,2.8],[/cocin|planch|fregar/,2.8],[/jardin|bricol|pintar|obra/,4.5],[/gimnasia|acrobac|pole/,4.5],[/danza|bailar|baile|salsa|bachata/,5.5],[/tai chi|taichi|estira|stretch/,2.5],[/paintball|airsoft/,6],[/trampol|salto/,4.5],[/slackline/,3.5]];for(const[r,m]of T)if(r.test(s))return m;return 4.5},
gOt=()=>{S.go={t:'',m:30};gShow(`<div style="display:flex;align-items:center"><h3 style="flex:1">Otra actividad</h3><button class=ib onclick=gClose() aria-label=Cerrar>✕</button></div><p class=sub style="margin:2px 0 12px">La IA de Rebostly estimará las calorías según la actividad, el tiempo y tu peso (${G.w} kg).</p><input class=zin id=got type=text maxlength=40 placeholder="Escribe la actividad (ej. Escalada, Karts...)" oninput=gOtI(this.value) autocomplete=off aria-label="Actividad"><div style="text-align:center;margin-top:14px"><b id=gom style="font-size:22px">${gfm(30)}</b></div><input class=zsl type=range min=5 max=180 step=5 value=30 oninput=gOtS(this.value) aria-label="Duración"><div style="display:flex;justify-content:space-between;margin-bottom:14px"><span class=sub>5 min</span><span class=sub>3 h</span></div><button class=zbt id=gob onclick=gOtGo() disabled>${ai('spark',18)} Calcular y Añadir</button>`)},

gMac=(p,h,g)=>`<div class=zmac><div><b>${nf(p)} g</b><span>Proteínas</span><i style="background:#22C55E"></i></div><div><b>${nf(h)} g</b><span>Hidratos</span><i style="background:#FACC15"></i></div><div><b>${nf(g)} g</b><span>Grasas</span><i style="background:#EF4444"></i></div></div>`,

gScanR=()=>{const d=S.gd;if($('#gm').style.display!='flex')return;gShow(`${gPh('sm done')}<div style="display:flex;align-items:center;gap:8px"><b style="font-size:18px;flex:1">${d[1]}</b><span class="bd gn">IA · 92% confianza</span></div><div class=zchips id=gdet></div><div class=zadj><button onclick=gStep(-10) aria-label="Menos gramos">−</button><div style="text-align:center"><span class=zbig id=gsk style="color:#16a34a"></span> <b>kcal</b><br><b id=gsg style="font-size:15px"></b></div><button onclick=gStep(10) aria-label="Más gramos">+</button></div><input class="zsl g" id=gsl type=range min=50 max=600 step=10 value=${S.gg} oninput=gSg(this.value) aria-label="Gramos"><div style="display:flex;justify-content:space-between"><span class=sub>− 50 g</span><span class=sub>+ 600 g</span></div><div id=gmc></div><p class=sub style="margin:2px 0 12px">¿No es exacto? Ajusta los gramos antes de guardar.</p><div style="display:flex;gap:8px"><button class="zbt l" style="width:auto;padding:15px 18px" onclick=gClose()>Cancelar</button><button class=zbt onclick=gOk()>Guardar registro</button></div>`);gUp()},

gTx=()=>{S.gtx={n:'',t:''};gShow(`<div style="display:flex;align-items:center"><h3 style="flex:1">Registro por texto</h3><button class=ib onclick=gClose() aria-label=Cerrar>✕</button></div><p class=sub style="margin:2px 0 12px">Cuéntale a la IA qué has comido y calculará calorías y macros.</p><span class=zlb>Nombre del plato</span><input class=zin id=gtn type=text maxlength=50 placeholder="Ej. Hamburguesa con patatas" oninput="gTxI('n',this.value)" autocomplete=off style="margin:6px 0 12px"><span class=zlb>Ingredientes y gramos</span><textarea class=zin id=gtt rows=3 maxlength=300 placeholder="Hamburguesa 200g, patatas 100g, pan 80g" oninput="gTxI('t',this.value)" style="margin:6px 0 4px;resize:none;display:block"></textarea><p class=sub style="margin-bottom:14px">Separa con comas. Si omites los gramos, usaré una ración estándar.</p><button class=zbt id=gtb onclick=gTxGo() disabled>${ai('spark',18)} Calcular e Ingerir</button>`)},

setTimeout(()=>{if($('#gm').style.display!='flex')return;const T=it.reduce((a,x)=>({k:a.k+x.k,p:a.p+x.p,h:a.h+x.h,g:a.g+x.gr,w:a.w+x.g}),{k:0,p:0,h:0,g:0,w:0}),nm=esc(gCap(n)||'Plato personalizado'),e={e:'📝',n:nm,k:Math.round(T.k),p:Math.round(T.p),h:Math.round(T.h),gr:Math.round(T.g)};G.meals.push(e);S.gtx.e=e;S.og=1;R(1);
gShow(`<div style="display:flex;align-items:center"><h3 style="flex:1">Añadido a tu ingesta</h3><button class=ib onclick=gClose() aria-label=Cerrar>✕</button></div><div style="display:flex;align-items:baseline;gap:8px;margin-top:4px"><b style="flex:1;font-size:15px">${nm}</b><span class=sub>${nf(T.w)} g</span></div><div style="text-align:center;margin:6px 0 0"><span class=zbig style="color:#16a34a">${nf(e.k)}</span> <b>kcal</b></div>${gMac(e.p,e.h,e.gr)}<div style="margin:4px 0 8px">${it.map(x=>`<div class=zbk><span>${esc(x.n)} · ${nf(x.g)} g${x.est?' ~':''}</span><em>${nf(x.k)} kcal</em></div>`).join('')}</div><p class=sub style="margin-bottom:12px">Estimación de la IA${it.some(x=>x.est)?' · «~» = valor genérico, no reconocí ese ingrediente':''}. Puede variar según la preparación.</p><div style="display:flex;gap:8px"><button class="zbt l" style="width:auto;padding:15px 18px" onclick=gTxUndo()>Deshacer</button><button class=zbt onclick=gClose()>Listo</button></div>`)},1200)},

gWheel=(k,min,max,st,u)=>{let o='';for(let v=min;v<=max;v+=st)o+=`<div>${v}</div>`;return `<div class=zw><div class=zwl>${u}</div><div class=zwb data-k=${k} data-min=${min} data-st=${st} onscroll=gWs(this)>${o}</div></div>`},
